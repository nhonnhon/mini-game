<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Săn Số Lưới Vuông NxN - Highscore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      @keyframes pop {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .animate-pop {
        animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .board-grid {
        display: grid;
        box-sizing: border-box;
        overflow: hidden;
        flex-shrink: 0;
      }
      .board-cell {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        line-height: 1;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white h-[100dvh] max-h-[100dvh] flex flex-col p-2 md:p-3 select-none overflow-hidden"
  >
    <!-- HEADER GỌN: quay lại + số cần tìm + thời gian + best -->
    <header
      class="w-full max-w-6xl mx-auto flex items-center gap-2 flex-shrink-0 mb-1.5"
    >
      <a
        href="index.html"
        aria-label="Về trang chủ"
        class="inline-flex items-center justify-center w-9 h-9 bg-gray-800 hover:bg-gray-700 active:scale-95 border border-gray-700 rounded-xl text-lg font-bold text-white shadow flex-shrink-0"
      >
        ←
      </a>

      <div
        class="flex-1 min-w-0 flex items-center justify-between gap-2 bg-gray-800/80 border border-gray-700 rounded-xl px-2.5 py-1.5"
      >
        <div class="flex items-baseline gap-1.5 min-w-0">
          <span class="text-gray-500 text-[10px] uppercase tracking-wide"
            >Tìm</span
          >
          <span
            id="target-display"
            class="text-lg md:text-xl font-black text-yellow-400 leading-none"
            >1</span
          >
        </div>

        <div class="flex items-baseline gap-1.5">
          <span class="text-gray-500 text-[10px] uppercase tracking-wide"
            >Time</span
          >
          <span
            id="timer-display"
            class="text-base md:text-lg font-mono font-bold text-green-400 leading-none tabular-nums"
            >0.00s</span
          >
        </div>

        <div class="flex items-baseline gap-1.5">
          <span class="text-gray-500 text-[10px] uppercase tracking-wide"
            >Best</span
          >
          <span
            id="highscore-display"
            class="text-sm md:text-base font-mono font-bold text-purple-400 leading-none tabular-nums"
            >--</span
          >
        </div>
      </div>
    </header>

    <!-- KHUNG CHƠI (chiếm phần lớn màn hình) -->
    <div
      class="board-stage w-full max-w-6xl mx-auto flex-1 min-h-0 flex items-center justify-center relative overflow-hidden bg-gray-950 rounded-2xl border border-gray-800 p-1.5 md:p-3"
    >
      <div
        id="game-container"
        class="w-full h-full min-h-0 min-w-0 flex items-center justify-center overflow-hidden"
      ></div>
    </div>

    <!-- THANH SETUP NHỎ Ở DƯỚI -->
    <footer
      class="w-full max-w-6xl mx-auto flex-shrink-0 mt-1.5 flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-xl px-2.5 py-1.5"
    >
      <label class="text-gray-400 text-[11px] font-semibold flex-shrink-0"
        >N</label
      >
      <input
        type="number"
        id="grid-n-input"
        min="3"
        max="10"
        value="10"
        oninput="updateHighScoreDisplay()"
        class="w-14 bg-gray-700 text-white text-center px-1 py-1 rounded-lg text-sm font-bold border border-gray-600 focus:outline-none focus:border-blue-500"
      />
      <span class="text-gray-600 text-[10px] hidden sm:inline"
        >3–10</span
      >
      <div class="flex-1"></div>
      <button
        onclick="initSquareGridGame()"
        class="bg-gradient-to-r from-purple-600 to-pink-600 active:scale-95 transition-transform px-3.5 py-1.5 rounded-lg font-bold text-xs text-white shadow"
      >
        Chơi
      </button>
    </footer>

    <script>
      let currentTarget = 1;
      let maxTarget = 100;
      let N = 10;
      let startTime = null;
      let timerInterval = null;
      let isPlaying = false;

      // Tạo key lưu highscore riêng biệt theo đúng giá trị N người dùng nhập
      function getStorageKey(gridSize) {
        return `schulte_highscore_${gridSize}x${gridSize}`;
      }

      function updateHighScoreDisplay() {
        let inputField = document.getElementById("grid-n-input");
        let nVal = parseInt(inputField.value);

        // Ràng buộc giá trị nhập trong khoảng từ 3 đến 10
        if (isNaN(nVal)) nVal = 10;
        if (nVal > 10) nVal = 10;
        if (nVal < 3) nVal = 3;

        let savedScore = localStorage.getItem(getStorageKey(nVal));
        let hsDisplay = document.getElementById("highscore-display");
        if (savedScore) {
          hsDisplay.innerText = parseFloat(savedScore).toFixed(2) + "s";
        } else {
          hsDisplay.innerText = "Chưa có";
        }
      }

      function initSquareGridGame() {
        let inputField = document.getElementById("grid-n-input");
        let n = parseInt(inputField.value);

        if (isNaN(n) || n < 3 || n > 10) {
          alert("M vui lòng nhập số hàng N từ 3 đến 10 thôi nhé!");
          inputField.value = 10;
          n = 10;
        }

        N = n;
        maxTarget = N * N;
        currentTarget = 1;
        document.getElementById("target-display").innerText = currentTarget;
        document.getElementById("timer-display").innerText = "0.00s";

        updateHighScoreDisplay();
        stopTimer();
        isPlaying = true;

        renderSquareBoard();
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function startGlobalTimer() {
        startTime = Date.now();
        timerInterval = setInterval(() => {
          let elapsed = (Date.now() - startTime) / 1000;
          document.getElementById("timer-display").innerText =
            elapsed.toFixed(2) + "s";
        }, 50);
      }

      function fitBoardGrid(grid) {
        const container = document.getElementById("game-container");
        if (!grid || !container) return;

        const gap = N >= 9 ? 2 : N >= 7 ? 3 : 4;
        const pad = 2;
        const size = Math.max(
          0,
          Math.floor(
            Math.min(container.clientWidth, container.clientHeight) - pad * 2,
          ),
        );

        grid.style.width = size + "px";
        grid.style.height = size + "px";
        grid.style.gap = gap + "px";
        grid.style.padding = "0";
        grid.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr))`;
        grid.style.gridTemplateRows = `repeat(${N}, minmax(0, 1fr))`;

        const cell = (size - gap * (N - 1)) / N;
        const fontSize = Math.max(8, Math.min(34, cell * 0.4));
        const radius = Math.max(4, Math.min(10, cell * 0.12));

        grid.querySelectorAll(".board-cell").forEach((el) => {
          el.style.fontSize = fontSize + "px";
          el.style.borderRadius = radius + "px";
        });
      }

      function renderSquareBoard() {
        const container = document.getElementById("game-container");
        container.innerHTML = "";

        let numbers = [];
        for (let i = 1; i <= maxTarget; i++) numbers.push(i);

        for (let i = numbers.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
        }

        const gridWrapper = document.createElement("div");
        gridWrapper.id = "board-grid";
        gridWrapper.className = "board-grid";

        numbers.forEach((num) => {
          const item = document.createElement("div");
          item.className =
            "board-cell w-full h-full bg-gray-800 border border-gray-700 flex items-center justify-center font-bold text-yellow-300 shadow cursor-pointer active:scale-95 transition-colors animate-pop";
          item.innerText = num;
          item.addEventListener("click", () => handleSquareClick(item, num));
          gridWrapper.appendChild(item);
        });

        container.appendChild(gridWrapper);
        fitBoardGrid(gridWrapper);
        requestAnimationFrame(() => fitBoardGrid(gridWrapper));
      }

      function handleSquareClick(item, num) {
        if (!isPlaying) return;

        if (currentTarget === 1 && !timerInterval) {
          startGlobalTimer();
        }

        if (num === currentTarget) {
          item.className =
            "board-cell w-full h-full bg-gray-800/40 border border-gray-700/30 flex items-center justify-center font-bold text-yellow-500/40 opacity-30 transition-colors pointer-events-none";
          fitBoardGrid(document.getElementById("board-grid"));

          currentTarget++;

          if (currentTarget <= maxTarget) {
            document.getElementById("target-display").innerText = currentTarget;
          } else {
            stopTimer();
            isPlaying = false;
            let finalTimeSeconds = (Date.now() - startTime) / 1000;
            let finalTimeString = finalTimeSeconds.toFixed(2) + "s";

            let storageKey = getStorageKey(N);
            let oldScore = localStorage.getItem(storageKey);
            let isNewRecord = false;

            if (!oldScore || finalTimeSeconds < parseFloat(oldScore)) {
              localStorage.setItem(storageKey, finalTimeSeconds);
              isNewRecord = true;
              updateHighScoreDisplay();
            }

            setTimeout(() => {
              if (isNewRecord) {
                alert(
                  `🔥 KỶ LỤC MỚI (${N}x${N})! M đã phá đảo trong: ${finalTimeString}`,
                );
              } else {
                alert(
                  `Quá đỉnh! M hoàn thành lưới ${N}x${N} trong: ${finalTimeString} (Kỷ lục cũ: ${parseFloat(oldScore).toFixed(2)}s)`,
                );
              }
            }, 100);
          }
        } else {
          if (navigator.vibrate) navigator.vibrate(100);
          item.classList.add("bg-red-600", "text-white");
          setTimeout(() => {
            item.classList.remove("bg-red-600", "text-white");
          }, 200);
        }
      }

      window.addEventListener("resize", () => {
        fitBoardGrid(document.getElementById("board-grid"));
      });

      window.onload = () => {
        updateHighScoreDisplay();
        initSquareGridGame();
      };
    </script>
  </body>
</html>
