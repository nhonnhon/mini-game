<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Trò Chơi Lật Thẻ Trí Nhớ - Memory Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      @keyframes pop {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .animate-pop {
        animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      .memory-grid {
        display: grid;
        box-sizing: border-box;
        overflow: hidden;
        flex-shrink: 0;
      }
      .memory-card {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white h-[100dvh] max-h-[100dvh] flex flex-col p-2 md:p-3 select-none overflow-hidden relative"
  >
    <!-- HEADER GỌN: quay lại + thời gian + cặp đã tìm + miss -->
    <header
      class="w-full max-w-6xl mx-auto flex items-center gap-2 flex-shrink-0 mb-1.5"
    >
      <a
        href="index.html"
        aria-label="Về trang chủ"
        class="inline-flex items-center justify-center w-9 h-9 bg-gray-800 hover:bg-gray-700 active:scale-95 border border-gray-700 rounded-xl text-lg font-bold text-white shadow flex-shrink-0"
      >
        ←
      </a>

      <div
        class="flex-1 min-w-0 flex items-center justify-between gap-2 bg-gray-800/80 border border-gray-700 rounded-xl px-2.5 py-1.5"
      >
        <div class="flex items-baseline gap-1.5">
          <span class="text-gray-500 text-[10px] uppercase tracking-wide"
            >Time</span
          >
          <span
            id="countdown-display"
            class="text-base md:text-lg font-mono font-bold text-red-400 leading-none tabular-nums"
            >--</span
          >
        </div>

        <div class="flex items-baseline gap-1.5">
          <span class="text-gray-500 text-[10px] uppercase tracking-wide"
            >Ghép</span
          >
          <span
            id="matched-display"
            class="text-base md:text-lg font-mono font-black text-green-400 leading-none"
            >0 / 0</span
          >
        </div>

        <div class="flex items-baseline gap-1.5">
          <span class="text-gray-500 text-[10px] uppercase tracking-wide"
            >Sai</span
          >
          <span
            id="miss-display"
            class="text-sm md:text-base font-mono font-bold text-yellow-400 leading-none"
            >0</span
          >
        </div>
      </div>
    </header>

    <!-- KHUNG CHƠI -->
    <div
      class="w-full max-w-6xl mx-auto flex-1 min-h-0 flex items-center justify-center relative overflow-hidden bg-gray-950 rounded-2xl border border-gray-800 p-1.5 md:p-3"
    >
      <div
        id="game-container"
        class="w-full h-full min-h-0 min-w-0 flex items-center justify-center overflow-hidden"
      >
        <div class="text-center text-gray-400 text-sm font-medium px-4">
          Chọn cặp & thời gian ở thanh dưới, bấm
          <span class="text-green-400 font-bold">"Chơi"</span> để bắt đầu
        </div>
      </div>
    </div>

    <!-- THANH SETUP NHỎ Ở DƯỚI -->
    <footer
      class="w-full max-w-6xl mx-auto flex-shrink-0 mt-1.5 flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-xl px-2.5 py-1.5 text-[11px] text-gray-400"
    >
      <span class="font-semibold flex-shrink-0">Cặp</span>
      <input
        type="number"
        id="pairs-input"
        min="4"
        max="18"
        value="10"
        class="w-12 bg-gray-700 text-white text-center px-1 py-1 rounded-lg text-sm font-bold border border-gray-600 focus:outline-none focus:border-blue-500"
      />
      <span class="font-semibold flex-shrink-0">Giây</span>
      <input
        type="number"
        id="time-input"
        min="10"
        max="180"
        value="60"
        class="w-14 bg-gray-700 text-white text-center px-1 py-1 rounded-lg text-sm font-bold border border-gray-600 focus:outline-none focus:border-blue-500"
      />
      <div class="flex-1"></div>
      <button
        onclick="resetToIdle()"
        class="bg-gray-700 hover:bg-gray-600 active:scale-95 px-2.5 py-1.5 rounded-lg font-bold text-xs text-white"
      >
        Reset
      </button>
      <button
        onclick="startGame()"
        class="bg-green-600 hover:bg-green-500 active:scale-95 px-3.5 py-1.5 rounded-lg font-bold text-xs text-white shadow"
      >
        Chơi
      </button>
    </footer>

    <!-- MÀN HÌNH KẾT THÚC (THẮNG / THUA) -->
    <div
      id="gameover-modal"
      class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden"
    >
      <div
        class="bg-gray-800 border border-gray-700 w-full max-w-xs md:max-w-sm p-6 rounded-3xl text-center shadow-2xl animate-pop"
      >
        <div id="modal-icon" class="text-5xl mb-3">🎉</div>
        <h2 id="modal-title" class="text-2xl font-black text-yellow-400 mb-1">
          CHIẾN THẮNG!
        </h2>
        <p id="modal-desc" class="text-gray-300 text-xs mb-4">
          M đã tìm khớp toàn bộ các cặp emoji.
        </p>

        <div class="bg-gray-900 p-4 rounded-2xl mb-5 space-y-2">
          <div>
            <span class="text-gray-400 text-xs">Thời gian còn lại:</span>
            <div id="final-time" class="text-2xl font-black text-green-400">
              0s
            </div>
          </div>
          <div>
            <span class="text-gray-400 text-xs">Số lượt lật sai:</span>
            <div id="final-miss" class="text-lg font-bold text-yellow-400">
              0
            </div>
          </div>
        </div>

        <button
          onclick="startGame()"
          class="w-full bg-gradient-to-r from-purple-600 to-pink-600 active:scale-95 transition-all py-3 rounded-xl font-bold text-base text-white shadow-lg"
        >
          Chơi Ván Mới
        </button>
      </div>
    </div>

    <script>
      // Kho tàng Emoji HTML phong phú
      const emojiPool = [
        "🍎",
        "🍌",
        "🍇",
        "🍉",
        "🍓",
        "🍒",
        "🍍",
        "🥝",
        "🥑",
        "🍔",
        "🍕",
        "🚀",
        "⭐",
        "🐱",
        "🐶",
        "🦊",
        "🐼",
        "🦁",
        "⚽",
        "🏀",
        "🚗",
        "✈️",
        "🎸",
        "💻",
        "🔥",
        "💎",
        "🍀",
        "🎯",
      ];

      let numPairs = 10;
      let totalCards = 20;
      let timeLimit = 60;
      let timeLeft = 60;
      let timerInterval = null;
      let isPlaying = false;

      let matchedPairs = 0;
      let missCount = 0;
      let firstCard = null;
      let secondCard = null;
      let lockBoard = false;

      function resetToIdle() {
        isPlaying = false;
        if (timerInterval) clearInterval(timerInterval);

        document.getElementById("countdown-display").innerText = "--";
        document.getElementById("matched-display").innerText = "0 / 0";
        document.getElementById("miss-display").innerText = "0";
        document.getElementById("gameover-modal").classList.add("hidden");

        const container = document.getElementById("game-container");
        container.innerHTML = `
                <div class="text-center text-gray-400 text-sm font-medium px-4">
                    Chọn cặp & thời gian ở thanh dưới, bấm <span class="text-green-400 font-bold">"Chơi"</span> để bắt đầu
                </div>
            `;
      }

      function startGame() {
        let pairsInput = document.getElementById("pairs-input");
        let timeInput = document.getElementById("time-input");

        numPairs = parseInt(pairsInput.value) || 10;
        if (numPairs < 4) numPairs = 4;
        if (numPairs > 18) numPairs = 18;
        pairsInput.value = numPairs;

        totalCards = numPairs * 2;

        timeLimit = parseInt(timeInput.value) || 60;
        if (timeLimit < 10) timeLimit = 10;
        timeInput.value = timeLimit;

        timeLeft = timeLimit;
        matchedPairs = 0;
        missCount = 0;
        firstCard = null;
        secondCard = null;
        lockBoard = false;

        document.getElementById("matched-display").innerText =
          `0 / ${numPairs}`;
        document.getElementById("miss-display").innerText = "0";
        document.getElementById("countdown-display").innerText = timeLeft + "s";
        document.getElementById("gameover-modal").classList.add("hidden");

        isPlaying = true;
        renderCardsBoard();
        startCountdown();
      }

      function bestGridLayout(total, availW, availH, gap) {
        let best = { cols: 1, rows: total, cell: 0 };
        for (let cols = 1; cols <= total; cols++) {
          const rows = Math.ceil(total / cols);
          const cellW = (availW - gap * (cols - 1)) / cols;
          const cellH = (availH - gap * (rows - 1)) / rows;
          const cell = Math.min(cellW, cellH);
          if (cell > best.cell) {
            best = { cols, rows, cell };
          }
        }
        return best;
      }

      function fitMemoryGrid(grid) {
        const container = document.getElementById("game-container");
        if (!grid || !container || totalCards <= 0) return;

        const availW = Math.max(0, container.clientWidth);
        const availH = Math.max(0, container.clientHeight);
        const gap = totalCards > 28 ? 3 : totalCards > 20 ? 4 : totalCards > 12 ? 6 : 8;
        const layout = bestGridLayout(totalCards, availW, availH, gap);

        const width = layout.cols * layout.cell + gap * (layout.cols - 1);
        const height = layout.rows * layout.cell + gap * (layout.rows - 1);

        grid.style.width = Math.floor(width) + "px";
        grid.style.height = Math.floor(height) + "px";
        grid.style.gap = gap + "px";
        grid.style.gridTemplateColumns = `repeat(${layout.cols}, minmax(0, 1fr))`;
        grid.style.gridTemplateRows = `repeat(${layout.rows}, minmax(0, 1fr))`;

        const emojiSize = Math.max(12, Math.min(42, layout.cell * 0.48));
        const markSize = Math.max(10, Math.min(28, layout.cell * 0.32));
        const radius = Math.max(6, Math.min(14, layout.cell * 0.14));

        grid.querySelectorAll(".card-face-back").forEach((el) => {
          el.style.fontSize = markSize + "px";
          el.style.borderRadius = radius + "px";
        });
        grid.querySelectorAll(".card-face-front").forEach((el) => {
          el.style.fontSize = emojiSize + "px";
          el.style.borderRadius = radius + "px";
        });
        grid.querySelectorAll(".card-inner").forEach((el) => {
          el.style.borderRadius = radius + "px";
        });
      }

      function renderCardsBoard() {
        const container = document.getElementById("game-container");
        container.innerHTML = "";

        let shuffledEmojis = [...emojiPool].sort(() => Math.random() - 0.5);
        let selectedEmojis = shuffledEmojis.slice(0, numPairs);
        let cardDeck = [...selectedEmojis, ...selectedEmojis];
        cardDeck.sort(() => Math.random() - 0.5);

        const grid = document.createElement("div");
        grid.id = "memory-grid";
        grid.className = "memory-grid";

        cardDeck.forEach((emoji) => {
          const card = document.createElement("div");
          card.className =
            "memory-card w-full h-full perspective-1000 cursor-pointer animate-pop";
          card.dataset.emoji = emoji;

          card.innerHTML = `
                    <div class="relative w-full h-full duration-300 transform-style-3d card-inner shadow-md">
                        <div class="card-face-back absolute inset-0 w-full h-full bg-gray-800 border border-gray-700 flex items-center justify-center font-bold text-purple-400 backface-hidden shadow-inner hover:bg-gray-700 transition-colors">
                            ❓
                        </div>
                        <div class="card-face-front absolute inset-0 w-full h-full bg-gray-700 border border-gray-600 flex items-center justify-center rotate-y-180 backface-hidden shadow-inner">
                            ${emoji}
                        </div>
                    </div>
                `;

          card.addEventListener("click", () => flipCard(card));
          grid.appendChild(card);
        });

        container.appendChild(grid);
        fitMemoryGrid(grid);
        requestAnimationFrame(() => fitMemoryGrid(grid));
      }

      function startCountdown() {
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
          if (!isPlaying) return;
          timeLeft--;
          document.getElementById("countdown-display").innerText =
            timeLeft + "s";

          if (timeLeft <= 0) {
            timeLeft = 0;
            document.getElementById("countdown-display").innerText = "0s";
            endGame(false);
          }
        }, 1000);
      }

      function flipCard(card) {
        if (!isPlaying || lockBoard) return;
        if (card === firstCard) return; // Không cho bấm 2 lần vào cùng 1 thẻ đang lật
        if (card.classList.contains("matched")) return; // Bỏ qua thẻ đã tìm ra trước đó

        // Lật thẻ bằng cách xoay inner
        let inner = card.querySelector(".card-inner");
        inner.classList.add("rotate-y-180");

        if (!firstCard) {
          firstCard = card;
          return;
        }

        secondCard = card;
        checkForMatch();
      }

      function checkForMatch() {
        let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

        if (isMatch) {
          disableCards();
        } else {
          unflipCards();
        }
      }

      function disableCards() {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        // Hiệu ứng mờ chìm xuống cho cặp đã đúng
        setTimeout(() => {
          firstCard.style.opacity = "0.25";
          firstCard.style.pointerEvents = "none";
          secondCard.style.opacity = "0.25";
          secondCard.style.pointerEvents = "none";
          resetTurn();

          matchedPairs++;
          document.getElementById("matched-display").innerText =
            `${matchedPairs} / ${numPairs}`;

          // Kiểm tra nếu đã tìm đủ hết tất cả các cặp -> CHIẾN THẮNG
          if (matchedPairs === numPairs) {
            endGame(true);
          }
        }, 300);
      }

      function unflipCards() {
        lockBoard = true;
        missCount++;
        document.getElementById("miss-display").innerText = missCount;

        if (navigator.vibrate) navigator.vibrate(100);

        setTimeout(() => {
          firstCard
            .querySelector(".card-inner")
            .classList.remove("rotate-y-180");
          secondCard
            .querySelector(".card-inner")
            .classList.remove("rotate-y-180");
          resetTurn();
        }, 800); // 0.8 giây để người chơi kịp nhìn thấy hình trước khi úp mặt lại
      }

      function resetTurn() {
        [firstCard, secondCard, lockBoard] = [null, null, false];
      }

      function endGame(isWin) {
        isPlaying = false;
        if (timerInterval) clearInterval(timerInterval);

        let modalIcon = document.getElementById("modal-icon");
        let modalTitle = document.getElementById("modal-title");
        let modalDesc = document.getElementById("modal-desc");

        if (isWin) {
          modalIcon.innerText = "🏆";
          modalTitle.innerText = "XUẤT SẮC!";
          modalDesc.innerText =
            "M đã lật khớp toàn bộ các cặp thẻ bài trí nhớ!";
          document.getElementById("final-time").innerText =
            timeLeft + "s (còn dư)";
        } else {
          modalIcon.innerText = "⏰";
          modalTitle.innerText = "HẾT GIỜ RỒI!";
          modalDesc.innerText =
            "Tiếc quá, chưa lật hết cặp mà thời gian đã cạn!";
          document.getElementById("final-time").innerText = "0s";
        }

        document.getElementById("final-miss").innerText = missCount;
        document.getElementById("gameover-modal").classList.remove("hidden");
      }

      window.addEventListener("resize", () => {
        fitMemoryGrid(document.getElementById("memory-grid"));
      });

      window.onload = () => {
        resetToIdle();
      };
    </script>
  </body>
</html>
